# Results archive (ADR-075), opt-out: the archive is enabled with a default
# destination, but the Certification carries nvcre.nvidia.com/archive: "false".
# Nothing is written; the state records Skipped.
waitFor:
  kind: Certification
  name: test-cert-archive-opt-out
  namespace: default
  condition: Succeeded
archive:
  clusterId: envtest
  default: prod
  destinations:
    prod: gs://nvcre-results/runs
  waitForState: Skipped
collect:
  - kind: Certification
    name: test-cert-archive-opt-out
    namespace: default
