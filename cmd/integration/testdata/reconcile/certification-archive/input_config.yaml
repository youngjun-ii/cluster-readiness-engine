# Results archive, terminal-branch emit: a Certification whose only
# Workflow is already terminal reaches Succeeded, the controller verifies the
# owned Workflows are terminal, builds the record from the private evidence
# journal, and writes it once to the fake store. The golden pins the record and
# the annotations.
waitFor:
  kind: Certification
  name: test-cert-archive
  namespace: default
  condition: Succeeded
archive:
  clusterId: envtest
  expectObjects: 1
  waitForState: Succeeded
collect:
  - kind: Certification
    name: test-cert-archive
    namespace: default
