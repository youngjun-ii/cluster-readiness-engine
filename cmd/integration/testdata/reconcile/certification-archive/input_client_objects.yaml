    nvcre.nvidia.com/category-variant: nccl-all-reduce
  annotations:
    nvcre.nvidia.com/requested-test-scale: full-scale
spec:
  jobTemplate:
    spec:
      workload:
        trainJob:
          runtimeRef:
            kind: TrainingRuntime
            name: nccl-all-reduce
          trainer:
            image: nvcr.io/nvidia/pytorch:26.01-py3
            numNodes: 2
      thresholds:
        busBandwidthGBps: "value >= 100"
  orchestration:
    iterations: 1
    target:
      nodeSelector:
        nvidia.com/gpu.present: "true"
  validation:
    performance:
      enabled: true
      thresholds:
        thresholds:
          busBandwidthGBps: "value >= 100"
status:
  conditions:
