      reason: AllGroupsSucceeded
      message: "All groups succeeded"
      lastTransitionTime: "2026-09-16T10:20:00Z"
    - type: Failed
      status: "False"
      reason: NotApplicable
      lastTransitionTime: "2026-09-16T10:00:00Z"
  orchestration:
    totalNodes: 2
    nodesPerJob: 2
    totalGroups: 1
    currentIteration: 1
    completedIterations: 1
    detectedPlatform: gcp
    detectedGPUArchitecture: gb200
    groups:
