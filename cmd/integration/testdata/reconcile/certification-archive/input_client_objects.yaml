apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: test-cert-archive
  namespace: default
  annotations:
    nvcre.nvidia.com/archive-destination: gs://nvcre-results/runs
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.present: "true"
      nvidia.com/gpu.product: NVIDIA-GB200-NVL72
  nodesPerJob: 2
  categories:
    - domain: communication
      variant: nccl-all-reduce
      options:
        thresholds:
          busBandwidthGBps: "value >= 100"
status:
  categoryStatuses:
    - domain: communication
      variant: nccl-all-reduce
      workflowRef:
        name: test-cert-archive-communication-nccl-all-reduce
        namespace: default
      status: InProgress
---
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Workflow
metadata:
  name: test-cert-archive-communication-nccl-all-reduce
  namespace: default
