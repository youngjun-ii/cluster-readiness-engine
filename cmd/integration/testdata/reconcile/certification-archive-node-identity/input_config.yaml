# Results archive, node identity capture: when the controller
# creates the first Workflow for a run that will be archived, it snapshots
# the discovered nodes into a ConfigMap it owns and records the name on the
# Certification. The golden pins the snapshot (UIDs normalised) and the
# annotation. Nothing is archived here: the run never reaches terminal.
waitFor:
  kind: Certification
  name: test-cert-archive-capture
  namespace: default
  condition: InProgress
generateNodes:
  count: 2
  providerID: "gce://envtest/us-central1-a/instance"
  labels:
    nvidia.com/gpu.product: NVIDIA-GB200-NVL72
    nvidia.com/gpu.clique: clique-a
archive:
  clusterId: envtest
  default: prod
  destinations:
    prod: gs://nvcre-results/runs
collect:
  - kind: Certification
    name: test-cert-archive-capture
    namespace: default
  - kind: ConfigMap
    name: node-identity-test-cert-archive-capture
    namespace: default
