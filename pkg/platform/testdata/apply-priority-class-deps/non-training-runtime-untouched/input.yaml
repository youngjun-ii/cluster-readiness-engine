# A ConfigMap dependency ahead of the runtime is skipped byte-for-byte.
priorityClassName: certification-low
dependencies:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: model-config
    data:
      config.yaml: |
        steps: 50
  - apiVersion: trainer.kubeflow.org/v1alpha1
    kind: TrainingRuntime
    metadata:
      name: torch-runtime
    spec:
      mlPolicy:
        numNodes: 2
      template:
        spec:
          replicatedJobs:
            - name: node
              template:
                spec:
                  template:
                    spec:
                      containers:
                        - name: node
                          image: nvcr.io/nvidia/nemo:25.07
