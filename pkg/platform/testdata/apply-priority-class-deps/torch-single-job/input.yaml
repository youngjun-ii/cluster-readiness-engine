# The torch shape most catalog entries emit: one replicatedJob named node.
priorityClassName: certification-low
dependencies:
  - apiVersion: trainer.kubeflow.org/v1alpha1
    kind: TrainingRuntime
    metadata:
      name: torch-runtime
    spec:
      mlPolicy:
        numNodes: 2
      template:
        spec:
          replicatedJobs:
            - name: node
              template:
                spec:
                  template:
                    spec:
                      containers:
                        - name: node
                          image: nvcr.io/nvidia/nemo:25.07
