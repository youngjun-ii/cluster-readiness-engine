# Without spec.priorityClassName no pod template names a class.
run:
  metadata:
    name: wr-priority
    namespace: default
  spec:
    image: nvcr.io/nvidia/pytorch:24.01-py3
    numNodes: 2
    framework:
      mpi:
        mpirunPath: /usr/local/mpi/bin/mpirun
        binary: /usr/local/bin/all_reduce_perf
gpusPerNode: 8
mlnxPerNode: 0
enableMNNVL: false
frameworkType: mpi
