# spec.priorityClassName reaches the one torch replicatedJob.
run:
  metadata:
    name: wr-priority
    namespace: default
  spec:
    image: nvcr.io/nvidia/pytorch:24.01-py3
    numNodes: 2
    priorityClassName: certification-low
    framework:
      torch:
        script: /workspace/train.py
gpusPerNode: 8
mlnxPerNode: 0
enableMNNVL: false
frameworkType: torch
