# Rule 2, the iteration trigger: iteration 1 failed one group, the Workflow
# rolled over and deleted its Jobs, and iteration 2 passed. The record keeps
# iteration 1 from iterationHistory with an evidence gap and a jobOutcome of
# UNKNOWN, and reduces node outcomes from the final iteration only, so the
# nodes are Passed. The stale WorkloadFailed entry from iteration 1 must not
# change that.
clusterId: voyager-7
captureIdentity: true
failedNodes:
  - configMap: failed-nodes-0f1e2d3c
    namespace: nvcre-runs
    nodes:
      - name: gpu-01
        reason: WorkloadFailed
        message: "first failed job: nccl-launcher (iteration 1)"
      - name: gpu-02
        reason: WorkloadFailed
        message: "first failed job: nccl-launcher (iteration 1)"
