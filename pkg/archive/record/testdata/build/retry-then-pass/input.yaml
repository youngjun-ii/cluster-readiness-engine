# Rule 1, the retry gap: completeTerminalGroup writes failed nodes BEFORE the
# retry branch, so a group that fails and then passes leaves stale
# WorkloadFailed entries in the failed-nodes ConfigMap. The group's final phase
# is Succeeded with retries=1, so the nodes must be Passed and the earlier
# attempt must be named as missing.
clusterId: voyager-7
captureIdentity: true
failedNodes:
  - configMap: failed-nodes-0f1e2d3c
    namespace: nvcre-runs
    nodes:
      - name: gpu-01
        reason: WorkloadFailed
        message: "first failed job: nccl-launcher (attempt 1)"
      - name: gpu-02
        reason: WorkloadFailed
        message: "first failed job: nccl-launcher (attempt 1)"
