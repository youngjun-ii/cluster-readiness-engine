# The bucket is unreachable while the Certification is being deleted. The one
# attempt fails, and the finalizer is removed anyway: an archive that cannot
# be written must never keep a run's objects alive.
config: {default: prod, destinations: {prod: gs://nvcre-results/runs}, clusterId: voyager-7}
terminal: Failed
workflows:
  - {name: wf, phase: Failed}
storeFailures:
  - {kind: transient, count: 5}
deletion: true
