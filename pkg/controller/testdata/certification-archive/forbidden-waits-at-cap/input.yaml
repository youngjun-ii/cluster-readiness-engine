# 403: the identity lacks storage.objects.create. That is fixed by a person,
# so the emitter waits the capped interval rather than climbing the ladder,
# warns once with the missing permission named, and keeps retrying.
config: {default: prod, destinations: {prod: gs://nvcre-results/runs}, clusterId: voyager-7}
terminal: Succeeded
workflows:
  - {name: wf, phase: Succeeded}
storeFailures:
  - {kind: forbidden, count: 3}
passes: 3
