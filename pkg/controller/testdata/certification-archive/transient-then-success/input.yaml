# Two 503s then success. The URI is resolved and recorded before the first
# write, the state is Retrying with the doubling backoff, one Warning covers
# both transient failures, and the third pass reuses the recorded key.
config: {default: prod, destinations: {prod: gs://nvcre-results/runs}, clusterId: voyager-7}
terminal: Succeeded
workflows:
  - {name: wf, phase: Succeeded}
storeFailures:
  - {kind: transient, count: 2}
passes: 4
