# Only the exact cordon check is dropped. An expression that combines it with
# something else was written deliberately and stays.
target:
  includeUnschedulable: true
nodeHealthMonitor:
  cel:
    expression: node.spec.unschedulable == true && node.metadata.labels['ready'] != 'true'
