# includeUnschedulable with selectors: the selector tolerations come first and
# the cordon toleration is appended, so the pods reach a node that is both
# tainted and cordoned.
hasLauncher: false
target:
  includeUnschedulable: true
  taintSelectors:
    - key: nvidia.com/gpu
      value: present
      effect: NoSchedule
