# The no-op path: same categories, no priorityClassName, nothing written.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: priority-cert
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-GB200
  nodesPerJob: 2
  categories:
    - domain: communication
      variant: nccl-all-reduce
    - domain: training
      variant: nemotron5-8b
      options:
        maxSteps: 50
