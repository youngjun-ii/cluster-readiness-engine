# Both fields set: the pods carry the class and the gang scheduler name, each
# written by its own helper.
apiVersion: nvcre.nvidia.com/v1alpha1
kind: Certification
metadata:
  name: priority-cert
spec:
  target:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-GB200
  nodesPerJob: 2
  priorityClassName: certification-low
  gangScheduler:
    schedulerName: kai-scheduler
    queue: certification
  categories:
    - domain: communication
      variant: nccl-all-reduce
    - domain: training
      variant: nemotron5-8b
      options:
        maxSteps: 50
