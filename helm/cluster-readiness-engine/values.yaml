# NVCRE Helm chart values.

nameOverride: nvcre

manager:
  replicas: 1
  # Maximum number of objects reconciled concurrently by each core controller
  # (Job, Workflow, Certification, and WorkloadRun).
  maxConcurrentReconciles: 10
  # Measurement controllers fetch and parse Pod logs, so their default is lower.
  measurementMaxConcurrentReconciles: 5
  image:
    repository: ghcr.io/nvidia/cluster-readiness-engine/manager
    tag: ""
    # Pin by digest instead of tag. When set, this wins over `tag` and the image
    # is referenced as repository@digest -- the only form that names the exact
    # bytes you verified, since a tag can be repointed after verification.
    # Example: sha256:735ad1e142a378b0919510bd1fc113cd53ab754bc79b7f0980d647d50a914523
    digest: ""
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 10m
      memory: 1Gi
  affinity: {}
  tolerations:
    - operator: Exists
  terminationGracePeriodSeconds: 10

metrics:
  port: 8443
  serviceMonitor:
    # The ServiceMonitor needs the Prometheus Operator CRDs
    # (monitoring.coreos.com/v1). Set to false on clusters without them.
    enabled: true

# Results archive: when a Certification reaches a stable terminal
# state, the controller writes one immutable JSON record describing the run to
# a Google Cloud Storage bucket. Off by default; with it off the controller
# behaves exactly as before.
resultsArchive:
  enabled: false
  # Runs opt in with `nvcrectl certification run --archive-to
  # gs://bucket[/prefix]`. The controller identity needs object-creation
  # permission on every bucket runs are allowed to select.
  # Recorded in every record and used in the object key. Required when enabled.
  clusterId: ""
  # Copy each failed Job's log tail (up to 32 KiB) into the record.
  includeFailureLog: false
  auth:
    # applicationDefault: Workload Identity on GKE (bind the controller's
    #   ServiceAccount to a Google service account with
    #   storage.objects.create on the bucket).
    # serviceAccountKey: mount a Secret holding a service-account JSON key and
    #   point GOOGLE_APPLICATION_CREDENTIALS at it (clusters off GCP).
    mode: applicationDefault
    serviceAccountKey:
      # Name of an existing Secret in the release namespace. Never a key value.
      existingSecret: ""
      # Key within the Secret that holds the JSON credentials file.
      key: credentials.json
