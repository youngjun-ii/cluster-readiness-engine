apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    {{- include "nvcre.labels" . | nindent 4 }}
    control-plane: manager
  name: {{ include "nvcre.resourceName" (dict "suffix" "manager" "context" $) }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.manager.replicas }}
  selector:
    matchLabels:
      {{- include "nvcre.selectorLabels" . | nindent 6 }}
      control-plane: manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        {{- include "nvcre.labels" . | nindent 8 }}
        control-plane: manager
    spec:
      {{- with .Values.manager.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - args:
        - --metrics-bind-address=:{{ .Values.metrics.port }}
        - --leader-elect
        - --health-probe-bind-address=:8081
        - --max-concurrent-reconciles={{ required "manager.maxConcurrentReconciles is required" .Values.manager.maxConcurrentReconciles }}
        - --measurement-max-concurrent-reconciles={{ required "manager.measurementMaxConcurrentReconciles is required" .Values.manager.measurementMaxConcurrentReconciles }}
        {{- with .Values.resultsArchive }}
        {{- if .enabled }}
        - --results-archive-enabled=true
        - --results-archive-cluster-id={{ required "resultsArchive.clusterId is required when resultsArchive.enabled is true" .clusterId }}
        {{- if .includeFailureLog }}
        - --results-archive-include-failure-log=true
        {{- end }}
        {{- end }}
        {{- end }}
        command:
        - /manager
        {{- $env := list }}
        {{- if .Values.manager.image.digest }}
        {{- $env = append $env (dict "name" "NVCRE_CONTROLLER_IMAGE_DIGEST" "value" .Values.manager.image.digest) }}
        {{- end }}
        {{- if and .Values.resultsArchive.enabled (eq .Values.resultsArchive.auth.mode "serviceAccountKey") }}
        {{- $env = append $env (dict "name" "GOOGLE_APPLICATION_CREDENTIALS" "value" (printf "/var/run/secrets/nvcre/results-archive/%s" .Values.resultsArchive.auth.serviceAccountKey.key)) }}
        {{- end }}
        {{- if $env }}
        env:
          {{- toYaml $env | nindent 10 }}
        {{- end }}
        {{- /*
          A digest wins over a tag. Verification is digest-addressed, so an
          operator who checked a signature and then deployed by tag deployed
          something the tag happened to resolve to at pull time, not the bytes
          they verified.
        */ -}}
        {{- if .Values.manager.image.digest }}
        image: {{ .Values.manager.image.repository }}@{{ .Values.manager.image.digest }}
        {{- else }}
        image: {{ .Values.manager.image.repository }}:{{ .Values.manager.image.tag | default .Chart.AppVersion }}
        {{- end }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: manager
        ports: []
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml .Values.manager.resources | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
        {{- if and .Values.resultsArchive.enabled (eq .Values.resultsArchive.auth.mode "serviceAccountKey") }}
        volumeMounts:
        - name: results-archive-credentials
          mountPath: /var/run/secrets/nvcre/results-archive
          readOnly: true
        {{- else }}
        volumeMounts: []
        {{- end }}
      {{- with .Values.manager.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: {{ include "nvcre.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.manager.terminationGracePeriodSeconds }}
      {{- with .Values.manager.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and .Values.resultsArchive.enabled (eq .Values.resultsArchive.auth.mode "serviceAccountKey") }}
      volumes:
      - name: results-archive-credentials
        secret:
          secretName: {{ required "resultsArchive.auth.serviceAccountKey.existingSecret is required for auth.mode serviceAccountKey" .Values.resultsArchive.auth.serviceAccountKey.existingSecret }}
          items:
          - key: {{ .Values.resultsArchive.auth.serviceAccountKey.key }}
            path: {{ .Values.resultsArchive.auth.serviceAccountKey.key }}
      {{- else }}
      volumes: []
      {{- end }}
